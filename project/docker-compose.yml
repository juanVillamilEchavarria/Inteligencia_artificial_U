services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ".:/app"
        # Mantiene el contenedor vivo y permite ejecutar comandos interactivos
        # (por ejemplo, el menú de src/interfaz_consola.py).
        stdin_open: true
        tty: true

networks:
    default:
        driver: bridge
